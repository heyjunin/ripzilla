services:
  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "15673:5672"   # AMQP port
      - "15674:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - ripzilla-network

  # Worker (serviço principal)
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASS=guest
      - QUEUE_NAME=jobs.audio.extract
      - DLQ_NAME=jobs.audio.extract.dlq
      - MAX_ATTEMPTS=3
      - MESSAGE_TTL=1800000
      - TEMP_DIR=/tmp/ripzilla
      - STORAGE_BASE_URL=http://localhost:8080/audio
      - FFMPEG_TIMEOUT=600
      - FFPROBE_TIMEOUT=120
      - LOG_LEVEL=INFO
    volumes:
      - ripzilla_temp:/tmp/ripzilla
    networks:
      - ripzilla-network
    restart: unless-stopped

  # Serviço de teste E2E
  e2e-test:
    build:
      context: .
      dockerfile: Dockerfile.test
    depends_on:
      rabbitmq:
        condition: service_healthy
      worker:
        condition: service_started
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - TEST_VIDEO_URL=https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4
      - REPLY_QUEUE=jobs.audio.extract.response
      - TEST_TIMEOUT_SECONDS=180
    networks:
      - ripzilla-network

networks:
  ripzilla-network:
    driver: bridge

volumes:
  rabbitmq_data:
  ripzilla_temp: 